name: Issue 958 focused verification
on:
  push:
    branches: [validation/issue-958]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Lifecycle, SQLite routing, metadata and existing PostgreSQL regressions
        run: >-
          ./mvnw -B -ntp -pl db2rest-api/api-rest -am
          -Dtest=DatabaseContextRequestInterceptorTest,DatabaseRoutingContextIntegrationTest,DbInfoControllerTest,SchemaControllerTest,PgMultiTenancyTest,PgReadControllerTest,PgCreateControllerTest
          -Dsurefire.failIfNoSpecifiedTests=false
          -DargLine="-javaagent:${HOME}/.m2/repository/org/mockito/mockito-core/5.17.0/mockito-core-5.17.0.jar"
          test
      - name: Upload focused test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-958-test-results
          path: db2rest-api/api-rest/target/surefire-reports/*.txt
