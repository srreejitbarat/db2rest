name: Full PR verification after upstream fixes

on:
  push:
    branches: [validation/full-ci-20261016]
    paths: [.github/workflows/full-ci-20261016.yml]
  workflow_dispatch:

permissions:
  contents: read

env:
  VERSION: '1.6.6-SNAPSHOT'

jobs:
  verify:
    name: Full build PR ${{ matrix.pr }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: 968
            sha: 33109c63c478c81fb377b9fd6e59bcfad17411dc
          - pr: 969
            sha: 4672cabe65d34650de31b3c69309a8401a2493fc
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'liberica'
          cache: 'maven'
      - name: Confirm exact PR head
        env:
          EXPECTED_SHA: ${{ matrix.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Full upstream Build and Test command
        run: ./mvnw --quiet -Drevision=$VERSION --no-transfer-progress -B verify --file pom.xml
      - name: Summarize all test reports
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET
          totals = dict(tests=0, failures=0, errors=0, skipped=0)
          reports = sorted(pathlib.Path('.').glob('**/target/surefire-reports/TEST-*.xml'))
          if not reports:
              raise SystemExit('No Surefire XML reports found')
          failures = []
          for report in reports:
              suite = ET.parse(report).getroot()
              for key in totals:
                  totals[key] += int(suite.get(key, 0))
              for case in suite.findall('testcase'):
                  if case.find('failure') is not None or case.find('error') is not None:
                      failures.append(case.get('classname', '') + '.' + case.get('name', ''))
          text = 'Full build totals: ' + ', '.join(f'{k}={v}' for k, v in totals.items())
          print(text)
          for failure in failures:
              print('FAILED: ' + failure)
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(text + '\n')
          if totals['failures'] or totals['errors']:
              raise SystemExit('Full build has failing tests')
          PY
      - name: Upload full verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-${{ matrix.pr }}-full-test-results
          path: |
            **/target/surefire-reports/TEST-*.xml
            **/target/surefire-reports/*.txt
          retention-days: 14
